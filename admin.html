<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Unknown Cards</title>
    <meta name="description" content="Admin Panel">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --primary-dark: #5b21b6;
            --accent: #c084fc;
            --accent-light: #d8b4fe;
            --neon-purple: #bf5af2;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
            --white: #ffffff;
            --error: #f87171;
            --bg-primary: #0a0612;
            --bg-secondary: #110a1c;
            --bg-tertiary: #1a1028;
            --bg-surface: rgba(26, 16, 40, 0.85);
            --bg-surface-hover: rgba(36, 24, 56, 0.9);
            --text-primary: #f0e6ff;
            --text-secondary: #c4b5d4;
            --text-muted: #8b7a9e;
            --border-subtle: 1px solid rgba(124, 58, 237, 0.12);
            --border-medium: 1px solid rgba(124, 58, 237, 0.25);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.6);
            --shadow-purple: 0 0 30px rgba(124, 58, 237, 0.15);
            --shadow-neon: 0 0 20px rgba(191, 90, 242, 0.2), 0 0 60px rgba(124, 58, 237, 0.1);
            --transition: 0.25s ease;
            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes neonPulse {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(124, 58, 237, 0.2), 0 0 30px rgba(124, 58, 237, 0.1);
            }

            50% {
                box-shadow: 0 0 20px rgba(124, 58, 237, 0.4), 0 0 60px rgba(124, 58, 237, 0.15);
            }
        }

        @keyframes borderGlow {

            0%,
            100% {
                border-color: rgba(124, 58, 237, 0.25);
            }

            50% {
                border-color: rgba(191, 90, 242, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 15% 0%, rgba(124, 58, 237, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 100%, rgba(191, 90, 242, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.03) 0%, transparent 70%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            letter-spacing: 0.02em;
        }

        /* Scanline */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px);
        }

        /* LOGIN */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 10, 28, 0.9);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--shadow-neon);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease;
            backdrop-filter: blur(16px);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--neon-purple), var(--primary), transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 1.5rem;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--neon-purple);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.2);
            animation: borderGlow 3s ease-in-out infinite;
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .login-header p {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .form-group label i {
            color: var(--accent);
            font-size: 0.8rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(10, 6, 18, 0.7);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 6px;
            color: var(--neon-green);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            transition: all var(--transition);
            outline: none;
            letter-spacing: 0.05em;
        }

        .form-group input:focus {
            border-color: var(--neon-purple);
            background: rgba(10, 6, 18, 0.9);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15), inset 0 0 20px rgba(124, 58, 237, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(139, 122, 158, 0.5);
            font-family: var(--font-mono);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 8px;
            color: var(--white);
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(191, 90, 242, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.35);
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            color: var(--error);
            font-size: 0.82rem;
            font-family: var(--font-mono);
            display: none;
            align-items: center;
            gap: 0.5rem;
        }

        .login-error.show {
            display: flex;
        }

        /* DASHBOARD */
        .dashboard {
            display: none;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dash-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .dash-title .icon {
            width: 50px;
            height: 50px;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .dash-title h1 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .dash-title p {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dash-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .search-box input {
            padding: 0.65rem 1rem 0.65rem 2.5rem;
            background: rgba(10, 6, 18, 0.7);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 6px;
            color: var(--neon-green);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            width: 300px;
            outline: none;
            transition: all var(--transition);
            letter-spacing: 0.03em;
        }

        .search-box input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .search-box input::placeholder {
            color: rgba(139, 122, 158, 0.5);
        }

        .logout-btn {
            padding: 0.65rem 1.25rem;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 6px;
            color: var(--error);
            font-size: 0.72rem;
            font-family: var(--font-mono);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.15);
            border-color: rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.1);
        }

        /* STATS */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(17, 10, 28, 0.85);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 10px;
            padding: 1.25rem;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.4), transparent);
        }

        .stat-card:hover {
            border-color: rgba(124, 58, 237, 0.35);
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.1);
        }

        .stat-card .label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
        }

        .stat-card .value {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--neon-green);
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }

        /* BIN GROUPS */
        .bin-groups-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .bin-group-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .bin-group {
            background: rgba(17, 10, 28, 0.85);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .bin-group::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 2px;
            height: 100%;
            background: transparent;
            transition: background var(--transition);
        }

        .bin-group:hover {
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: var(--shadow-neon);
        }

        .bin-group:hover::before {
            background: var(--neon-purple);
            box-shadow: 0 0 10px rgba(191, 90, 242, 0.5);
        }

        .bin-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            cursor: pointer;
            user-select: none;
            transition: background var(--transition);
            gap: 1rem;
        }

        .bin-group-header:hover {
            background: rgba(36, 24, 56, 0.5);
        }

        .bin-group-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .bin-group-icon {
            width: 42px;
            height: 42px;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.25);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: var(--neon-purple);
            flex-shrink: 0;
        }

        .bin-group-info {
            flex: 1;
            min-width: 0;
        }

        .bin-group-title {
            font-family: var(--font-body);
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .bin-group-title .bin-label {
            font-family: var(--font-mono);
            letter-spacing: 0.15em;
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.2);
        }

        .bin-group-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.5rem;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.25);
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--accent);
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .bin-group-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
            font-family: var(--font-mono);
            letter-spacing: 0.03em;
        }

        .bin-group-arrow {
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .bin-group:hover .bin-group-arrow {
            color: var(--neon-purple);
            transform: translateX(4px);
            filter: drop-shadow(0 0 4px rgba(191, 90, 242, 0.5));
        }

        /* LOADING & EMPTY */
        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            letter-spacing: 0.05em;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(124, 58, 237, 0.15);
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.4;
            color: var(--accent);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        ::selection {
            background: rgba(124, 58, 237, 0.4);
            color: var(--text-primary);
        }

        @media (max-width:768px) {
            .dashboard {
                padding: 1rem;
            }

            .dash-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box input {
                width: 100%;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- LOGIN -->
    <div class="login-container" id="login-view">
        <div class="login-card">
            <div class="login-header">
                <div class="icon"><i class="fas fa-shield-alt"></i></div>
                <h1>Admin Panel</h1>
                <p>Unknown Cards — Acceso Administrativo</p>
            </div>
            <div class="login-error" id="login-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="login-error-text">Error</span>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="admin-user" placeholder="Nombre de usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="admin-pass" placeholder="Contraseña" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> <span>Iniciar Sesión</span>
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard-view">
        <div class="dash-header">
            <div class="dash-title">
                <div class="icon"><i class="fas fa-database"></i></div>
                <div>
                    <h1>Card Database</h1>
                    <p>Unknown Cards — Admin Panel</p>
                </div>
            </div>
            <div class="dash-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Buscar por número, IP, fecha...">
                </div>
                <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="label">Total Tarjetas</div>
                <div class="value" id="stat-total">—</div>
            </div>
            <div class="stat-card">
                <div class="label">BINs Únicos</div>
                <div class="value" id="stat-bins">—</div>
            </div>
        </div>

        <div id="cards-container">
            <div class="loading-state">
                <div class="loading-spinner"></div>Cargando datos...
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        let searchTimeout = null;

        const stored = sessionStorage.getItem('admin_token');
        if (stored) { authToken = stored; showDashboard(); }

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            errorEl.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Verificando...</span>';
            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('admin-user').value,
                        password: document.getElementById('admin-pass').value
                    })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    sessionStorage.setItem('admin_token', authToken);
                    showDashboard();
                } else {
                    document.getElementById('login-error-text').textContent = data.error || 'Credenciales inválidas';
                    errorEl.classList.add('show');
                }
            } catch (err) {
                document.getElementById('login-error-text').textContent = 'Error de conexión';
                errorEl.classList.add('show');
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Iniciar Sesión</span>';
        });

        document.getElementById('logout-btn').addEventListener('click', function () {
            authToken = null;
            sessionStorage.removeItem('admin_token');
            document.getElementById('dashboard-view').classList.remove('show');
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('admin-pass').value = '';
        });

        document.getElementById('search-input').addEventListener('input', function () {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadCards(), 400);
        });

        function showDashboard() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').classList.add('show');
            loadCards();
        }

        async function loadCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>Cargando datos...</div>';

            const search = document.getElementById('search-input').value;
            try {
                const res = await fetch(`/api/admin-cards?page=1&limit=9999&search=${encodeURIComponent(search)}`, {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (res.status === 401) {
                    authToken = null;
                    sessionStorage.removeItem('admin_token');
                    document.getElementById('dashboard-view').classList.remove('show');
                    document.getElementById('login-view').style.display = 'flex';
                    return;
                }
                const data = await res.json();
                if (!data.success) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error cargando datos</p></div>';
                    return;
                }

                // Group by BIN
                const groups = {};
                data.data.forEach(card => {
                    const bin = (card.card_number || '').replace(/\s/g, '').substring(0, 6);
                    if (!groups[bin]) groups[bin] = [];
                    groups[bin].push(card);
                });
                const bins = Object.keys(groups).sort();

                document.getElementById('stat-total').textContent = data.data.length;
                document.getElementById('stat-bins').textContent = bins.length;

                if (bins.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No se encontraron tarjetas</p></div>';
                    return;
                }

                container.innerHTML = '<div class="bin-groups-container">' + bins.map(bin => {
                    const cards = groups[bin];
                    const latest = cards.reduce((l, c) => {
                        const d = c.created_at ? new Date(c.created_at) : new Date(0);
                        return d > l ? d : l;
                    }, new Date(0));
                    const dateStr = latest.toLocaleString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                    return '<a href="/admin/bin/' + bin + '.html" class="bin-group-link">' +
                        '<div class="bin-group">' +
                        '<div class="bin-group-header">' +
                        '<div class="bin-group-header-left">' +
                        '<div class="bin-group-icon"><i class="fas fa-credit-card"></i></div>' +
                        '<div class="bin-group-info">' +
                        '<div class="bin-group-title">' +
                        '<span class="bin-label">' + bin + '</span>' +
                        '<span class="bin-group-badge"><i class="fas fa-layer-group"></i> ' + cards.length + ' tarjeta' + (cards.length > 1 ? 's' : '') + '</span>' +
                        '</div>' +
                        '<div class="bin-group-meta">Última: ' + dateStr + '</div>' +
                        '</div>' +
                        '</div>' +
                        '<i class="fas fa-chevron-right bin-group-arrow"></i>' +
                        '</div>' +
                        '</div>' +
                        '</a>';
                }).join('') + '</div>';

            } catch (err) {
                console.error('Load error:', err);
                container.innerHTML = '<div class="empty-state"><i class="fas fa-wifi"></i><p>Error de conexión</p></div>';
            }
        }
    </script>
</body>

</html>
