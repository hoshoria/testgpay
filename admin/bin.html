<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIN Detail - Unknown Cards</title>
    <meta name="description" content="BIN Detail - Admin Panel">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --primary-dark: #5b21b6;
            --accent: #c084fc;
            --accent-light: #d8b4fe;
            --neon-purple: #bf5af2;
            --neon-cyan: #22d3ee;
            --neon-green: #4ade80;
            --white: #ffffff;
            --success: #4ade80;
            --warning: #fbbf24;
            --error: #f87171;
            --bg-primary: #0a0612;
            --bg-secondary: #110a1c;
            --bg-tertiary: #1a1028;
            --bg-surface: rgba(26, 16, 40, 0.85);
            --bg-surface-hover: rgba(36, 24, 56, 0.9);
            --bg-elevated: rgba(44, 28, 68, 0.9);
            --text-primary: #f0e6ff;
            --text-secondary: #c4b5d4;
            --text-muted: #8b7a9e;
            --border-subtle: 1px solid rgba(124, 58, 237, 0.12);
            --border-medium: 1px solid rgba(124, 58, 237, 0.25);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.6);
            --shadow-purple: 0 0 30px rgba(124, 58, 237, 0.15);
            --shadow-neon: 0 0 20px rgba(191, 90, 242, 0.2), 0 0 60px rgba(124, 58, 237, 0.1);
            --transition-base: 0.25s ease;
            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes borderGlow {

            0%,
            100% {
                border-color: rgba(124, 58, 237, 0.25);
            }

            50% {
                border-color: rgba(191, 90, 242, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 15% 0%, rgba(124, 58, 237, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 100%, rgba(191, 90, 242, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.03) 0%, transparent 70%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            letter-spacing: 0.02em;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99999;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 4px);
        }

        .page-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeInUp 0.5s ease;
        }

        /* HEADER */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .page-title .icon {
            width: 52px;
            height: 52px;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
        }

        .page-title h1 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .page-title p {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
        }

        .back-btn {
            padding: 0.65rem 1.25rem;
            background: rgba(124, 58, 237, 0.08);
            border: 1px solid rgba(124, 58, 237, 0.25);
            border-radius: 6px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.25);
            transform: translateY(-1px);
        }

        /* STATS */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(17, 10, 28, 0.85);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 10px;
            padding: 1.25rem;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.4), transparent);
        }

        .stat-card:hover {
            border-color: rgba(124, 58, 237, 0.35);
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.1);
        }

        .stat-card .label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
        }

        .stat-card .value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--neon-green);
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }

        /* CARDS LIST */
        .cards-container {
            background: rgba(17, 10, 28, 0.85);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(12px);
        }

        .cards-list {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .card-item {
            background: rgba(10, 6, 18, 0.6);
            border: 1px solid rgba(124, 58, 237, 0.08);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            display: grid;
            grid-template-columns: 1fr 80px 140px 1fr auto auto;
            align-items: center;
            gap: 1rem;
            transition: all var(--transition-base);
        }

        .card-item:hover {
            background: rgba(36, 24, 56, 0.5);
            border-color: rgba(124, 58, 237, 0.2);
        }

        .card-num {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--neon-green);
            letter-spacing: 0.08em;
            font-size: 0.85rem;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.15);
        }

        .card-expiry {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .ip-cell {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--neon-cyan);
        }

        .ip-location {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .date-cell {
            font-size: 0.72rem;
            white-space: nowrap;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .delete-btn {
            padding: 0.35rem 0.65rem;
            background: rgba(248, 113, 113, 0.08);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 4px;
            color: var(--error);
            font-size: 0.72rem;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .delete-btn:hover {
            background: rgba(248, 113, 113, 0.15);
            border-color: rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.1);
        }

        .delete-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* PAGINATION */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1rem;
            border-top: 1px solid rgba(124, 58, 237, 0.1);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .pg-info {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }

        .pg-controls {
            display: flex;
            gap: 0.3rem;
        }

        .pg-btn {
            padding: 0.35rem 0.65rem;
            background: rgba(10, 6, 18, 0.5);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .pg-btn:hover:not(:disabled) {
            background: rgba(124, 58, 237, 0.15);
            border-color: var(--primary);
            color: var(--accent);
        }

        .pg-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.2);
        }

        .pg-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* LOADING & EMPTY */
        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            letter-spacing: 0.05em;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(124, 58, 237, 0.15);
            border-top-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.82rem;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.4;
            color: var(--accent);
        }

        /* AUTH ERROR */
        .auth-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1.5rem;
            text-align: center;
        }

        .auth-error i {
            font-size: 2.5rem;
            color: var(--error);
            opacity: 0.6;
            filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.3));
        }

        .auth-error p {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        ::selection {
            background: rgba(124, 58, 237, 0.4);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 1rem;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-item {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="page-container" id="main-content">
        <div class="loading-state" id="loading">
            <div class="loading-spinner"></div>
            Cargando datos...
        </div>
    </div>

    <script>
        const CARDS_PER_PAGE = 15;
        let authToken = null;
        let allCards = [];
        let currentPage = 1;
        let currentBin = '';

        // Get BIN from URL
        const urlParams = new URLSearchParams(window.location.search);
        currentBin = urlParams.get('bin') || '';

        // If no bin, try to extract from path: /admin/bin/123456.html
        if (!currentBin) {
            const pathMatch = window.location.pathname.match(/\/admin\/bin\/(\d+)\.html/);
            if (pathMatch) currentBin = pathMatch[1];
        }

        // Check auth
        authToken = sessionStorage.getItem('admin_token');

        if (!authToken) {
            showAuthError();
        } else if (!currentBin) {
            showError('No se especificó un BIN');
        } else {
            document.title = `BIN ${currentBin} - Unknown Cards`;
            loadBinCards();
        }

        function showAuthError() {
            document.getElementById('main-content').innerHTML = `
                <div class="auth-error">
                    <i class="fas fa-lock"></i>
                    <p>Sesión expirada o no autenticado</p>
                    <a href="/admin.html" class="back-btn">
                        <i class="fas fa-sign-in-alt"></i> Ir al Login
                    </a>
                </div>`;
        }

        function showError(msg) {
            document.getElementById('main-content').innerHTML = `
                <div class="auth-error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${msg}</p>
                    <a href="/admin.html" class="back-btn">
                        <i class="fas fa-arrow-left"></i> Volver al Panel
                    </a>
                </div>`;
        }

        async function loadBinCards() {
            try {
                const params = new URLSearchParams({ page: 1, limit: 9999, search: currentBin });
                const res = await fetch(`/api/admin-cards?${params}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.status === 401) {
                    sessionStorage.removeItem('admin_token');
                    showAuthError();
                    return;
                }

                const data = await res.json();

                if (!data.success) {
                    showError('Error cargando datos');
                    return;
                }

                // Filter only cards matching this BIN
                allCards = data.data.filter(card => {
                    const num = (card.card_number || '').replace(/\s/g, '');
                    return num.substring(0, 6) === currentBin;
                });

                renderPage();

            } catch (err) {
                console.error('Load error:', err);
                showError('Error de conexión');
            }
        }

        function renderPage() {
            const totalPages = Math.ceil(allCards.length / CARDS_PER_PAGE);
            const container = document.getElementById('main-content');

            container.innerHTML = `
                <div class="page-header">
                    <div class="page-title">
                        <div class="icon"><i class="fas fa-credit-card"></i></div>
                        <div>
                            <h1>BIN ${currentBin}</h1>
                            <p>${allCards.length} tarjeta${allCards.length !== 1 ? 's' : ''} encontrada${allCards.length !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                    <a href="/admin.html" class="back-btn">
                        <i class="fas fa-arrow-left"></i> Volver al Panel
                    </a>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="label">Total Tarjetas</div>
                        <div class="value">${allCards.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">BIN</div>
                        <div class="value" style="letter-spacing:0.1em">${currentBin}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Página</div>
                        <div class="value">${currentPage} / ${totalPages || 1}</div>
                    </div>
                </div>

                <div class="cards-container">
                    <div class="cards-list" id="cards-list"></div>
                    <div class="pagination" id="pagination"></div>
                </div>`;

            renderCards();
        }

        function renderCards() {
            const totalPages = Math.ceil(allCards.length / CARDS_PER_PAGE);
            const start = (currentPage - 1) * CARDS_PER_PAGE;
            const end = Math.min(start + CARDS_PER_PAGE, allCards.length);
            const pageCards = allCards.slice(start, end);

            const listEl = document.getElementById('cards-list');

            if (allCards.length === 0) {
                listEl.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No se encontraron tarjetas para este BIN</p></div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            listEl.innerHTML = pageCards.map(card => {
                const cardNum = card.card_number || '—';
                const formatted = cardNum.replace(/\s/g, '').replace(/(.{4})/g, '$1 ').trim();
                const expiry = card.expiry || '—';
                const ip = card.ip_address || '—';

                let location = '—';
                if (card.ip_info) {
                    const info = typeof card.ip_info === 'string' ? JSON.parse(card.ip_info) : card.ip_info;
                    const parts = [];
                    if (info.city) parts.push(info.city);
                    if (info.region) parts.push(info.region);
                    if (info.country) parts.push(info.country);
                    if (parts.length) location = parts.join(', ');
                }

                const date = card.created_at ? new Date(card.created_at).toLocaleString('es-ES', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                }) : '—';

                return `<div class="card-item" id="row-${card.id}">
                    <span class="card-num">${formatted}</span>
                    <span class="card-expiry">${expiry}</span>
                    <span class="ip-cell">${ip}</span>
                    <span class="ip-location">${location}</span>
                    <span class="date-cell">${date}</span>
                    <button class="delete-btn" onclick="deleteCard(${card.id}, this)"><i class="fas fa-trash-alt"></i> Eliminar</button>
                </div>`;
            }).join('');

            // Pagination
            const pgEl = document.getElementById('pagination');
            if (totalPages <= 1) {
                pgEl.innerHTML = `<span class="pg-info">${allCards.length} tarjeta${allCards.length > 1 ? 's' : ''}</span><span></span>`;
                return;
            }

            let html = `<span class="pg-info">${start + 1}-${end} de ${allCards.length}</span>`;
            html += '<div class="pg-controls">';
            html += `<button class="pg-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

            const maxVisible = 5;
            let startPg = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPg = Math.min(totalPages, startPg + maxVisible - 1);
            if (endPg - startPg < maxVisible - 1) startPg = Math.max(1, endPg - maxVisible + 1);

            for (let p = startPg; p <= endPg; p++) {
                html += `<button class="pg-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
            }

            html += `<button class="pg-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
            html += '</div>';
            pgEl.innerHTML = html;
        }

        function goPage(page) {
            const totalPages = Math.ceil(allCards.length / CARDS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteCard(id, btn) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta tarjeta?')) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const res = await fetch(`/api/admin-delete-card?id=${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (res.ok) {
                    // Remove from local array
                    allCards = allCards.filter(c => c.id !== id);
                    // Adjust page if needed
                    const totalPages = Math.ceil(allCards.length / CARDS_PER_PAGE);
                    if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
                    renderPage();
                } else {
                    alert('Error al eliminar la tarjeta');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-trash-alt"></i> Eliminar';
                }
            } catch (err) {
                alert('Error de conexión');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-trash-alt"></i> Eliminar';
            }
        }
    </script>
</body>

</html>
